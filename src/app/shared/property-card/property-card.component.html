<article class="property-card">
  <a [routerLink]="['/propiedades',property.slug]" class="image-wrap"><img [src]="property.image" [alt]="property.title"><span class="pill">{{property.operation}}</span></a>
  <div class="content"><p class="location">{{property.location}}</p><h3>{{property.title}}</h3><div class="specs"><span>{{property.bedrooms}} rec.</span><span>{{property.bathrooms}} baños</span><span>{{property.constructionSize}} m²</span></div><div class="bottom"><strong>{{property.price | currency:'MXN':'symbol-narrow':'1.0-0'}}</strong><a [routerLink]="['/propiedades',property.slug]">Ver propiedad →</a></div></div>
</article>
